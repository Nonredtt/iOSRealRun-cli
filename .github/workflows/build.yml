name: Build Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check-out repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        shell: powershell
        run: pip install -r requirements.txt

      - name: Build Executable
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: main.py
          mode: onefile
          assume-yes-for-downloads: true
          output-dir: build

      - name: Package Windows Runtime
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "output\libimobiledevice" | Out-Null
          $exe = Get-ChildItem "build\*.exe" | Select-Object -First 1
          if (-not $exe) { throw "No executable was produced by Nuitka." }
          Copy-Item $exe.FullName "output\main.exe"
          Copy-Item "config.yaml" "output\"
          Get-ChildItem "*route.txt" | Copy-Item -Destination "output\"
          Copy-Item "DeveloperDiskImage" "output\DeveloperDiskImage" -Recurse
          Copy-Item "libimobiledevice\win\*" "output\libimobiledevice\" -Recurse

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOSRealRun-cli-Windows-x64
          path: output\